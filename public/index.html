<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descargador de videos (uso personal)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <section id="menu-screen">
      <h1>Descargador de videos</h1>
      <p class="subtitle">Herramienta de uso personal. Elige de dónde quieres descargar.</p>

      <div class="platform-menu">
        <button type="button" class="platform-card platform-youtube" onclick="openPlatform('youtube')">
          <span class="platform-icon">▶</span>
          <span class="platform-name">YouTube</span>
        </button>
        <button type="button" class="platform-card platform-facebook" onclick="openPlatform('facebook')">
          <span class="platform-icon">f</span>
          <span class="platform-name">Facebook</span>
        </button>
        <button type="button" class="platform-card platform-twitter" onclick="openPlatform('twitter')">
          <span class="platform-icon">𝕏</span>
          <span class="platform-name">Twitter / X</span>
        </button>
        <button type="button" class="platform-card platform-instagram" onclick="openPlatform('instagram')">
          <span class="platform-icon">◎</span>
          <span class="platform-name">Instagram</span>
        </button>
      </div>
    </section>

    <section id="downloader-screen" hidden>
      <button type="button" class="back-button" onclick="closePlatform()">&larr; Volver</button>

      <h1 id="downloader-title">Descargador</h1>
      <p class="subtitle" id="downloader-subtitle">Pega un enlace y elige el formato.</p>

      <input
        id="url"
        type="text"
        placeholder="https://..."
        autocomplete="off"
      />

      <div class="buttons">
        <button id="btn-mp4" onclick="download('mp4')">Descargar MP4</button>
        <button id="btn-mp3" onclick="download('mp3')">Descargar MP3</button>
      </div>

      <div id="quality-grid" class="quality-grid" hidden></div>

      <p id="status" class="status"></p>

      <div id="debug-panel" class="debug-panel" hidden>
        <div class="debug-header">
          <span>Registro de depuración</span>
          <button id="debug-copy" type="button">Copiar log</button>
        </div>
        <pre id="debug-output" class="debug-output"></pre>
      </div>
    </section>
  </main>

  <script src="debug.js"></script>
  <script src="app.js"></script>
</body>
</html>
